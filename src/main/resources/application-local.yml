spring:
  # 로컬 시크릿도 운영과 같은 방식 — ./local-secrets/ 의 파일 이름이 프로퍼티 키 (../local/setup-secrets.sh)
  config.import: optional:configtree:./local-secrets/
  # 🔴 로컬 DB 도 catalog_svc 유저로 붙습니다 (postgres 수퍼유저면 스키마 경계 위반이 로컬에서 통과합니다)
  datasource.url: jdbc:postgresql://localhost:5432/indie_db?currentSchema=catalog&ApplicationName=catalog
  # 로컬도 운영과 같이 Flyway(V1 구조 · V2 값) + validate 로 돕니다 (application.yml 의 설정 그대로).
  # 🔴 마이그레이션 파일을 고쳤거나 예전에 ddl-auto 로 만든 테이블이 남아 있으면 로컬 DB 의 catalog 스키마를 비우고 띄우세요
  kafka.bootstrap-servers: localhost:9092
  data.redis:
    host: localhost
    port: 6380                                # 캐시용 Redis (compose 의 redis-cache)

springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true                    # http://localhost:8082/swagger-ui.html

app:
  payment.base-url: http://localhost:8084

logging:
  pattern.console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
